# ORCA — LoRA tối ưu domain tài chính đa mảng
base_model: Qwen/Qwen2.5-7B-Instruct

load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_use_double_quant: true

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.5e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  optim: paged_adamw_8bit
  bf16: true
  max_seq_length: 2048
  packing: false
  logging_steps: 5
  save_strategy: epoch

generation:
  temperature: 0.35
  top_p: 0.9
  max_tokens: 1600
  repetition_penalty: 1.05
